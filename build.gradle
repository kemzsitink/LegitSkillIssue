buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        // JUnit Platform Gradle plugin — required for Gradle < 4.6 to run JUnit 5 tests.
        // (useJUnitPlatform() was added in Gradle 4.6; this project uses Gradle 4.4.1.)
        classpath 'org.junit.platform:junit-platform-gradle-plugin:1.2.0'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.junit.platform.gradle.plugin'
apply plugin: 'jacoco'
apply plugin: 'checkstyle'
// NOTE: The SpotBugs Gradle plugin requires Gradle 5+; this project uses Gradle 4.4.1.
// Gradle's built-in 'findbugs' plugin is the Gradle-4-compatible predecessor to SpotBugs
// and provides equivalent static analysis via the same underlying engine.
apply plugin: 'findbugs'

version = "1.0.0"
group = "com.client.legitskillissue"
archivesBaseName = "legitskillissue-forge"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
}

repositories {
    mavenCentral()
}

configurations {
    jmh
}

dependencies {
    // JUnit 5
    testCompile 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    testCompile 'org.junit.jupiter:junit-jupiter-params:5.9.0'
    testRuntime 'org.junit.jupiter:junit-jupiter-engine:5.9.0'

    // jqwik property-based testing (bundles JUnit Platform)
    testCompile 'net.jqwik:jqwik:1.7.0'

    // Mockito
    testCompile 'org.mockito:mockito-core:4.8.0'
    testCompile 'org.mockito:mockito-junit-jupiter:4.8.0'

    // JMH benchmarking (kept in a separate configuration to avoid polluting test classpath)
    jmh 'org.openjdk.jmh:jmh-core:1.35'
    jmh 'org.openjdk.jmh:jmh-generator-annprocess:1.35'
}

// ── JUnit Platform plugin configuration ──────────────────────────────────────
junitPlatform {
    filters {
        engines {
            include 'junit-jupiter', 'jqwik'
        }
    }
}

// ── JaCoCo ──────────────────────────────────────────────────────────────────
jacoco {
    toolVersion = '0.8.8'
}

jacocoTestReport {
    reports {
        xml.enabled  true
        html.enabled true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'PACKAGE'
            // Apply 80% line-coverage threshold to the utility package
            includes = ['com/client/legitskillissue/util']
            limit {
                counter = 'LINE'
                value   = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// ── Checkstyle ───────────────────────────────────────────────────────────────
checkstyle {
    toolVersion = '9.3'
    configFile  = file('config/checkstyle/checkstyle.xml')
    // Only check main sources; test sources use a relaxed style
    sourceSets  = [sourceSets.main]
    ignoreFailures = true
}

// ── FindBugs (SpotBugs-compatible static analysis for Gradle 4.x) ────────────
// SpotBugs Gradle plugin requires Gradle 5+; findbugs is the built-in equivalent.
findbugs {
    ignoreFailures = true
    effort = 'max'
    reportLevel = 'medium'
}

// ── processResources ─────────────────────────────────────────────────────────
processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
